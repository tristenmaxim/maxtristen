<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор музыки</title>
<meta name="description" content="Генеративная лоу-фай и фоновая музыка для работы. Всё пишется в браузере, по нотам, без записей.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎛️</text></svg>">
<link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body>
<canvas id="viz"></canvas>

<div class="wrap">
  <header class="top">
    <a class="back" href="../../">← vidwizr</a>
    <span class="seedchip" id="seedchip">—</span>
  </header>

  <main>
    <h1 id="scene-name">Генератор музыки</h1>
    <p class="tagline" id="scene-hint">Ноты, гармония и ритм считаются в браузере. Записей нет — каждый трек новый.</p>

    <section class="nowplaying" id="nowplaying">
      <div class="np-row">
        <div class="np-cell"><span class="lbl">Тональность</span><span class="val" id="np-key">—</span></div>
        <div class="np-cell"><span class="lbl">Темп</span><span class="val" id="np-bpm">—</span></div>
        <div class="np-cell"><span class="lbl">Часть</span><span class="val" id="np-section">—</span></div>
        <div class="np-cell"><span class="lbl">Такт</span><span class="val" id="np-bar">—</span></div>
      </div>
      <div class="chords" id="chords"></div>
      <div class="progname" id="np-prog">—</div>
    </section>

    <div class="transport">
      <button id="play" class="play" aria-label="Играть">
        <span class="ico" id="play-ico">▶</span>
      </button>
      <button id="regen" class="ghost">Новый трек</button>
      <button id="share" class="ghost">Ссылка</button>
    </div>
    <p class="status" id="status">Нажмите ▶ — движок соберёт трек и подгрузит сэмплы.</p>

    <section class="scenes" id="scenes"></section>

    <section class="knobs">
      <label class="knob"><span>Громкость <b id="v-master">80%</b></span>
        <input type="range" id="k-master" min="0" max="100" value="80"></label>
      <label class="knob"><span>Плотность <b id="v-intensity">60%</b></span>
        <input type="range" id="k-intensity" min="0" max="100" value="60"></label>
      <label class="knob"><span>Яркость <b id="v-brightness">50%</b></span>
        <input type="range" id="k-brightness" min="0" max="100" value="50"></label>
      <label class="knob"><span>Пространство <b id="v-space">50%</b></span>
        <input type="range" id="k-space" min="0" max="100" value="50"></label>
      <label class="knob"><span>Шум и винил <b id="v-texture">35%</b></span>
        <input type="range" id="k-texture" min="0" max="100" value="35"></label>
    </section>

    <section class="codebox">
      <button id="codetoggle" class="ghost wide">Показать партитуру (код Strudel)</button>
      <pre id="code" class="code hidden"></pre>
    </section>

    <footer class="foot">
      Собрано на <a href="https://strudel.cc" target="_blank" rel="noopener">Strudel</a>.
      Сэмплы — VCSL, Salamander Piano, tidal-drum-machines.
    </footer>
  </main>
</div>

<script src="https://unpkg.com/@strudel/web@1.3.0"></script>
<script src="assets/theory.js?v=2"></script>
<script src="assets/generator.js?v=2"></script>
<script src="assets/app.js?v=2"></script>
</body>
</html>
