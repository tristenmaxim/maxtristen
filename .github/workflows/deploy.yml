name: Deploy

on:
  push:
    branches: [main]

env:
  SERVER: 146.103.109.188
  REMOTE_DIR: /opt/vidwizr-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER" >> ~/.ssh/known_hosts

      - name: Sync repo to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='downloads' \
            ./ root@"$SERVER":"$REMOTE_DIR"/

      - name: Install deps, deploy config, restart services
        run: |
          ssh root@"$SERVER" bash -s <<'EOF'
            set -e
            cd /opt/vidwizr-service

            # photo backend: venv + deps
            cd photo/backend
            [ -d venv ] || python3 -m venv venv
            venv/bin/pip install -q -r requirements.txt
            cd /opt/vidwizr-service

            # downloader backend: node deps
            cd downloader/backend
            npm ci --omit=dev
            cd /opt/vidwizr-service

            # nginx + systemd config
            cp deploy/nginx-vidwizr-service.conf /etc/nginx/sites-available/vidwizr-service
            ln -sf /etc/nginx/sites-available/vidwizr-service /etc/nginx/sites-enabled/vidwizr-service
            rm -f /etc/nginx/sites-enabled/background-music

            cp deploy/vidwizr-photo.service /etc/systemd/system/vidwizr-photo.service
            cp deploy/vidwizr-downloader.service /etc/systemd/system/vidwizr-downloader.service

            systemctl daemon-reload
            systemctl enable --now vidwizr-photo vidwizr-downloader
            systemctl restart vidwizr-photo vidwizr-downloader

            nginx -t
            systemctl reload nginx
          EOF

      - name: Health check
        run: |
          sleep 3
          for path in "" "music/" "photo/" "downloader/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://$SERVER:8090/$path")
            echo "GET /$path -> $code"
            if [ "$code" != "200" ]; then
              echo "Health check failed for /$path"
              exit 1
            fi
          done
