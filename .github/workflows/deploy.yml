name: Deploy

on:
  push:
    branches: [main]

env:
  SERVER: 146.103.109.188
  REMOTE_DIR: /opt/maxtristen
  DOMAIN: maxtristen.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER" >> ~/.ssh/known_hosts

      - name: Sync repo to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='downloads' \
            ./ root@"$SERVER":"$REMOTE_DIR"/

      - name: Install deps, deploy config, restart services
        run: |
          ssh root@"$SERVER" bash -s <<'EOF'
            set -e
            cd /opt/maxtristen

            # photo backend: venv + deps
            cd photo/backend
            [ -d venv ] || python3 -m venv venv
            venv/bin/pip install -q -r requirements.txt
            cd /opt/maxtristen

            # downloader backend: node deps
            cd downloader/backend
            npm ci --omit=dev
            cd /opt/maxtristen

            # nginx + systemd config
            cp deploy/nginx-maxtristen.conf /etc/nginx/sites-available/maxtristen
            ln -sf /etc/nginx/sites-available/maxtristen /etc/nginx/sites-enabled/maxtristen

            cp deploy/maxtristen-photo.service /etc/systemd/system/maxtristen-photo.service
            cp deploy/maxtristen-downloader.service /etc/systemd/system/maxtristen-downloader.service

            systemctl daemon-reload
            systemctl enable --now maxtristen-photo maxtristen-downloader
            systemctl restart maxtristen-photo maxtristen-downloader

            nginx -t
            systemctl reload nginx
          EOF

      - name: Health check
        run: |
          sleep 3
          for path in "" "music/" "photo/" "downloader/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://$DOMAIN/$path")
            echo "GET /$path -> $code"
            if [ "$code" != "200" ]; then
              echo "Health check failed for /$path"
              exit 1
            fi
          done
