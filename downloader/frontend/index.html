<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Downloader — vidwizr</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <a href="../" class="back-link">← vidwizr</a>
    <div class="page">
      <h1>Video Downloader</h1>
      <p class="page-sub">YouTube · TikTok · Instagram</p>

      <div class="form">
        <input type="text" id="url-input" placeholder="Вставь ссылку сюда" class="url-input" />

        <div id="button-container">
          <button id="download-button" class="btn-primary">Скачать</button>
        </div>

        <div id="terminal-output" class="terminal hidden">
          <span class="yt-dlp">[yt-dlp]</span>
          <span class="download">[download]</span>
          <span id="progress-text">Starting download... wait a min</span>
        </div>

        <div id="error-message" class="error hidden"></div>
      </div>
    </div>

    <script src="assets/app.js" defer></script>
  </body>
</html>
